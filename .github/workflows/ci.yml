name: ci

# Standard library only: the coordinator core has no dependencies, no model
# and no SUMO. The mock comparison must reproduce the committed example, and
# the approval numbers in README.md must fall out of data/course_run_B_s42.jsonl.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Mock comparison reproduces the committed example
        run: |
          python scripts/mock_compare.py
          python - <<'PY'
          import json
          fresh = json.load(open("output/mock_compare.json", encoding="utf-8"))
          committed = json.load(open("examples/mock_compare.json", encoding="utf-8"))
          assert fresh == committed, "output/mock_compare.json drifted from examples/mock_compare.json"
          print("mock comparison matches the committed example")
          PY
      - name: Approval numbers in the README are recounted from the shipped log
        run: python scripts/recount_approvals.py --check
